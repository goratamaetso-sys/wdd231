<body>
    <header>
        <span id="title">Florida Chamber of Commerce</span>
        <button id="hamburger" class="hamburger"> ☰</button>
        <nav id="nav-menu" class="nav-menu">

                <li><a href="join.html" class="active">Join</a></li>   
	        </ul>
        </nav>
    </header>
    <main>
        <h1>Membership Application</h1>
        <section class="membership-section">
            <section class="membership-form">
                <h2>Membership Form</h2>
                <form method="GET" action="thankyou.html">
                <label>First Name <input type="text" name="first" required autocomplete="given-name" title="Your First Name"></label>
                <label>Last Name <input type="text" name="last" required autocomplete="family-name" title="Your Last Name"></label>
                <label>Organizational Title <input type="text" name="title" required autocomplete="organization-title" title="Your Organization title" pattern="[A-Za-z -]{7,}"></label>
                <label>Phone Number<input type="tel" name="phone" required autocomplete="tel" title="A Phone Number with dashes" placeholder="987-555-1234" ></label>
                <label>Email <input type="email" name="email" required placeholder="janesmith90@gmail.com"  title="Your Email" autocomplete="email"></label>
                <label>Business Name <input type="text" name="business" required autocomplete="organization" title="Your Organization's Name"></label>
                
                <label>
                    Membership Level:
                    <select name="membership-level" title="Membership Level" required>
                        <option value="" disabled selected>Select a Membership Level</option>
                        <option value="np">NP Membership (Non-profit, no fee)</option>
                        <option value="bronze">Bronze Membership</option>
                        <option value="silver">Silver Membership</option>
                        <option value="gold">Gold Membership</option>
                    </select>
                </label>

                <label>
                    Business Description:
                    <textarea name="description" title="Describe your business" rows="5" cols="30"></textarea>
                </label>
                <input type="hidden" name="timestamp" id="timestamp">

                <input type="submit" value="Join the Community">
            </form>
        </section>


        <section class="membership-container">
            <h2>Membership Levels</h2>
            <div class="membership-cards" id="membership-cards"></div>
        </section>
    </section>
    <dialog class="modal" id="membership-details"></dialog>

    </main> 
    <footer>
        <div class="company-contact">
            <p>123 Main Street, Florida, Roodeport</p>
            <p>Phone: (555) 123-4567</p>
            <p>Email: info@floridachamber.com</p>
